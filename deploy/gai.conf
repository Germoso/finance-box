# Preferir IPv4 sobre IPv6 en getaddrinfo()
#
# Problema: el contenedor NO tiene ruta IPv6 de salida, pero el resolver sigue
# devolviendo registros AAAA y glibc los ordena por delante de los A. El cliente
# HTTP de Ruby intenta primero IPv6 y la conexión falla de forma intermitente
# (medido: 3/5 y luego 4/5 intentos OK contra query1.finance.yahoo.com).
#
# Solucion upstream (compose.example.yml): forzar DNS a 8.8.8.8 / 1.1.1.1, lo
# que envia toda tu resolucion DNS a Google/Cloudflare.
#
# Solucion usada aqui: dar prioridad absoluta a IPv4 conservando el DNS del host.
# Documentacion: glibc getaddrinfo(3) -> "policy defined in /etc/gai.conf"
#
# Se monta en modo solo lectura sobre /etc/gai.conf (web y worker).
precedence ::ffff:0:0/96  100
